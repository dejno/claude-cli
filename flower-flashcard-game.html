<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Flashcard Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        h1 {
            color: white;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-size: 2.5rem;
        }

        .theme-selector {
            margin-bottom: 2rem;
        }

        .theme-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .theme-btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .theme-btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .theme-btn.active {
            background: #4CAF50;
            color: white;
        }

        .game-info {
            margin-bottom: 2rem;
            color: white;
            font-size: 1.2rem;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 3px;
            margin: 1rem 0;
        }

        .progress-fill {
            background: #4CAF50;
            height: 20px;
            border-radius: 7px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .flashcard-container {
            perspective: 1000px;
            margin: 2rem auto;
            width: 350px;
            height: 250px;
            position: relative;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .card-front {
            background: linear-gradient(135deg, #ff7eb3 0%, #ff758c 100%);
            color: white;
            padding: 0;
            position: relative;
        }

        .card-back {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            transform: rotateY(180deg);
            padding: 1rem;
        }

        .flower-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .flower-name-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            padding: 1rem;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        .flower-name {
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            margin: 0;
        }

        .flower-info {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
            max-height: 100%;
            overflow: hidden;
        }

        .flower-scientific {
            font-style: italic;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #666;
        }

        .flower-description {
            font-size: 0.9rem;
            line-height: 1.3;
            flex-grow: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .flower-uses {
            font-size: 0.8rem;
            color: #555;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .game-controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .control-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .control-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .control-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .game-complete {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .game-complete h2 {
            color: #4CAF50;
            margin-bottom: 1rem;
        }

        @media (max-width: 600px) {
            .flashcard-container {
                width: 300px;
                height: 220px;
            }

            .flower-name {
                font-size: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🌸 Flower Flashcard Game 🌸</h1>

        <div class="theme-selector">
            <h2 style="color: white; margin-bottom: 1rem;">Choose Your Theme:</h2>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="northern-california">Northern California</button>
                <button class="theme-btn" data-theme="florida">Florida</button>
            </div>
        </div>

        <div class="game-area hidden">
            <div class="game-info">
                <div class="card-counter">
                    <span id="current-card">1</span> of <span id="total-cards">0</span> cards
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="flashcard-container">
                <div class="flashcard" id="flashcard">
                    <div class="card-face card-front">
                        <img class="flower-image" id="flower-image" alt="Flower" />
                        <div class="flower-name-overlay">
                            <div class="flower-name" id="flower-name"></div>
                        </div>
                    </div>
                    <div class="card-face card-back">
                        <div class="flower-info">
                            <div class="flower-scientific" id="flower-scientific"></div>
                            <div class="flower-description" id="flower-description"></div>
                            <div class="flower-uses" id="flower-uses"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="game-controls">
                <button class="control-btn" id="flip-btn">Flip Card</button>
                <button class="control-btn" id="prev-btn">Previous</button>
                <button class="control-btn" id="next-btn">Next</button>
                <button class="control-btn" id="exit-btn">Exit</button>
                <button class="control-btn" id="restart-btn">Restart</button>
            </div>
        </div>

        <div class="game-complete hidden" id="game-complete">
            <h2>🎉 Tada! 🎉</h2>
            <p>You've completed all the flashcards in this theme!</p>
            <div class="game-controls">
                <button class="control-btn" id="home-btn">Home</button>
                <button class="control-btn" id="play-again-btn">Play Again</button>
            </div>
        </div>
    </div>

        class FlashcardGame {
            constructor() {
                this.currentTheme = null;
                this.currentCards = [];
                this.currentCardIndex = 0;
                this.isFlipped = false;
                this.initialize();
            }

            initialize() {
                this.bindEvents();
            }

            bindEvents() {
                // Theme selection
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.selectTheme(btn.dataset.theme));
                });

                // Game controls
                document.getElementById('flip-btn').addEventListener('click', () => this.flipCard());
                document.getElementById('next-btn').addEventListener('click', () => this.nextCard());
                document.getElementById('prev-btn').addEventListener('click', () => this.prevCard());
                document.getElementById('exit-btn').addEventListener('click', () => this.exitGame());
                document.getElementById('restart-btn').addEventListener('click', () => this.restartGame());
                document.getElementById('play-again-btn').addEventListener('click', () => this.playAgain());
                document.getElementById('home-btn').addEventListener('click', () => this.goHome());

                // Card click to flip
                document.getElementById('flashcard').addEventListener('click', () => this.flipCard());
            }

            selectTheme(theme) {
                this.currentTheme = theme;
                this.currentCards = [...flowerData[theme]];
                this.currentCardIndex = 0;
                this.isFlipped = false;

                // Update UI
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });

                document.querySelector('.theme-selector').classList.add('hidden');
                document.querySelector('.game-area').classList.remove('hidden');
                document.getElementById('game-complete').classList.add('hidden');

                this.updateCard();
                this.updateProgress();
            }

            updateCard() {
                const card = this.currentCards[this.currentCardIndex];

                document.getElementById('flower-name').textContent = card.name;
                document.getElementById('flower-image').src = card.image;
                document.getElementById('flower-image').alt = card.name;
                document.getElementById('flower-scientific').textContent = card.scientific;
                document.getElementById('flower-description').textContent = card.description;
                document.getElementById('flower-uses').textContent = card.uses;

                document.getElementById('current-card').textContent = this.currentCardIndex + 1;
                document.getElementById('total-cards').textContent = this.currentCards.length;

                // Reset flip state
                if (this.isFlipped) {
                    this.flipCard();
                }

                // Update button states
                document.getElementById('prev-btn').disabled = this.currentCardIndex === 0;
                document.getElementById('next-btn').disabled = this.currentCardIndex === this.currentCards.length - 1;
            }

            updateProgress() {
                const progress = ((this.currentCardIndex + 1) / this.currentCards.length) * 100;
                document.getElementById('progress-fill').style.width = progress + '%';
            }

            flipCard() {
                const flashcard = document.getElementById('flashcard');
                flashcard.classList.toggle('flipped');
                this.isFlipped = !this.isFlipped;

                const flipBtn = document.getElementById('flip-btn');
                flipBtn.textContent = this.isFlipped ? 'Show Name' : 'Show Details';
            }

            nextCard() {
                if (this.currentCardIndex < this.currentCards.length - 1) {
                    this.currentCardIndex++;
                    this.updateCard();
                    this.updateProgress();
                } else {
                    this.showGameComplete();
                }
            }

            prevCard() {
                if (this.currentCardIndex > 0) {
                    this.currentCardIndex--;
                    this.updateCard();
                    this.updateProgress();
                }
            }

            restartGame() {
                this.currentCardIndex = 0;
                this.updateCard();
                this.updateProgress();
                document.getElementById('game-complete').classList.add('hidden');
            }

            showGameComplete() {
                document.querySelector('.game-area').classList.add('hidden');
                document.getElementById('game-complete').classList.remove('hidden');
            }

            exitGame() {
                document.querySelector('.theme-selector').classList.remove('hidden');
                document.querySelector('.game-area').classList.add('hidden');
                document.getElementById('game-complete').classList.add('hidden');

                // Reset theme selection
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.remove('active');
                });

                this.currentTheme = null;
            }

            goHome() {
                this.exitGame();
            }

            playAgain() {
                this.exitGame();
            }
        }

        // Initialize the game when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new FlashcardGame();
        });
    </script>
</body>
</html>
